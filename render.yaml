# =============================================================================
# Render Blueprint for Aether AI (headless API + web dashboard)
# -----------------------------------------------------------------------------
# Deploy:  Render Dashboard -> New + -> Blueprint -> pick this repository
# Docs:    RENDER_DEPLOY_TH.md (Thai) / README "Deploy on Render"
#
# The service uses the headless requirements file, so the build stays small and
# installs in well under a minute.  GUI-only routers (desktop control, live
# testing, autonomous desktop actions) disable themselves at runtime; everything
# else (chat, memory, voice synthesis, bug-bounty recon, monitoring, n8n ...) is
# available.
#
# BRANCH: no `branch:` is set on purpose - Render then deploys every service
# from the branch you pick when creating the Blueprint ("Render uses the
# Blueprint's branch if the service uses the same repo").  So you can deploy the
# current work straight from `arena/01a0e54b-aether-ai`, or from `main` once the
# pull request is merged.
# =============================================================================
services:
  - type: web
    name: aether-ai-api
    runtime: python
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health
    buildFilter:
      # Do not rebuild the API when only the ChatGPT app / other front-ends change
      ignoredPaths:
        - chatgpt-app/**
        - ui-ts/**
        - ui/**
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-server.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Render generates a strong secret for you
      - key: AETHER_SECRET_KEY
        generateValue: true
      # Allow the dashboard / any front-end origin to call the API
      - key: ALLOWED_ORIGINS
        value: "*"
      # Keep the heavy desktop features off in the cloud
      - key: ENABLE_SCREEN_MONITORING
        value: "false"
      - key: ENABLE_PC_CONTROL
        value: "false"
      - key: ENABLE_DAILY_REPORTS
        value: "false"
      # ---- AI provider keys (set in the Render dashboard, never in Git) ----
      # At least one is required for chat to answer.
      - key: GROQ_API_KEY          # free tier available at console.groq.com
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY        # optional, web search tool
        sync: false
      - key: PORCUPINE_API_KEY     # optional, wake word
        sync: false

  # ---------------------------------------------------------------------------
  # ChatGPT app (MCP server + widget) - lets ChatGPT call the Aether tools above.
  # Connect it in ChatGPT: Settings -> Connectors -> Advanced -> Developer mode
  # -> Add custom connector -> https://<this-service>.onrender.com/mcp
  # ---------------------------------------------------------------------------
  - type: web
    name: aether-chatgpt-app
    runtime: node
    plan: free
    region: singapore
    rootDir: chatgpt-app
    autoDeploy: true
    healthCheckPath: /
    # Measured build peaks at ~500 MB RSS, which is right at the free plan's
    # 512 MB.  If the build dies with "Killed"/SIGKILL, either move this one
    # service to the Starter plan (2 GB) or build it on your machine.
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npx next start -H 0.0.0.0
    buildFilter:
      ignoredPaths:
        - src/**
        - tools/**
        - data/**
        - ui-ts/**
        - ui/**
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Where the MCP tools find Aether: the API service created above.
      - key: AETHER_API_URL
        fromService:
          type: web
          name: aether-ai-api
          envVarKey: RENDER_EXTERNAL_URL
      # Optional bearer token if you later protect the API with auth.
      # - key: AETHER_API_TOKEN
      #   sync: false
      # Public URL of THIS app. Render sets RENDER_EXTERNAL_URL at build time, so
      # normally you can leave this blank; fill it in if you attach a custom
      # domain (then redeploy so the widget assets point at the new host).
      - key: NEXT_PUBLIC_BASE_URL
        sync: false

